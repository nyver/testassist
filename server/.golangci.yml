version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - gosec
    - ineffassign
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - unused
  settings:
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
