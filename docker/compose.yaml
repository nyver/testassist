# Test Assistant server.
#
#   cp .env.example .env        # then put your provider API keys into .env
#   cp ../config.example.yaml config.yaml   # then set tls.self_signed_hosts in it
#   sh ../scripts/init-volumes.sh           # once: creates ./data and ./certs for UID 65532
#   docker compose up -d --build
#
# The first start generates a self-signed certificate and an API token. Read
# them with:
#   docker compose logs                                     (certificate fingerprint)
#   docker compose exec test-assistant /server token show   (API token)
# The image has no shell, but the server binary provides these commands.

name: test-assistant

services:
  test-assistant:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
    image: test-assistant-server:${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "8447:8447"
    environment:
      # Provider keys come from .env or the shell. An empty key disables the provider.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      SERVER_NAME: ${SERVER_NAME:-Test Assistant}
      APP_LISTEN_ADDR: ":8447"
      APP_CONFIG: /etc/test-assistant/config.yaml
    volumes:
      # Persistent state: server.json and auth.json (data), the TLS
      # certificate and key (certs). Both must be writable by UID 65532.
      - ./data:/data
      - ./certs:/certs
      # The configuration file (see the README). It must exist before the first
      # `docker compose up`: otherwise Docker creates a directory in its place.
      - ./config.yaml:/etc/test-assistant/config.yaml:ro
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Longer than the server's 30 s graceful-shutdown timeout, so Docker does
    # not kill the container while requests are still finishing.
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
